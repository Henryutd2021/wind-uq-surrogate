[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-uq-surrogate"
version = "1.1.0"
description = "UQ metrics for wind time series and surrogate models that map them to calibrated plant-level wind power uncertainty, including at unobserved plants (framework)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Honglin Li"}]
requires-python = ">=3.10"
# Lower bounds = oldest versions the test suite was run with (and passed); newest tested: see environment.yml
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "scikit-learn>=1.3"]
keywords = ["wind energy", "uncertainty quantification", "surrogate model", "Gaussian process", "probabilistic forecasting", "pinball loss"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest"]
# reader of the public PERFORM files (case_studies/perform_ercot); figures of the case study need matplotlib
perform = ["h5py>=3.7"]
case-study = ["h5py>=3.7", "matplotlib>=3.7"]

[project.scripts]
wind-uq-surrogate = "wind_uq_surrogate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
